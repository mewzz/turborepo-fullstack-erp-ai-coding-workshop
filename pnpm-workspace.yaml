packages:
  - apps/*
  - packages/*

# Hoist dependencies into a flat node_modules instead of the deep .pnpm/<pkg>@<peer-hash>/...
# layout. Those nested paths exceed Windows' 260-char limit and get truncated/corrupted
# unless long-path support is enabled system-wide. Hoisting keeps paths short so a host
# install (pnpm dev:local) works on Windows without admin rights.
nodeLinker: hoisted

# node_modules is shared between your machine and the Docker containers (bind mount).
# Install native binaries (esbuild, rolldown, lightningcss, ...) for every platform
# so the same install works on macOS, Windows/WSL and the Linux containers.
supportedArchitectures:
  os: [current, linux, darwin, win32]
  cpu: [current, x64, arm64]
  libc: [current, glibc]

# Dependencies allowed to run install scripts (pnpm blocks them by default).
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true

# The containers and your machine use different pnpm stores. Don't auto-reinstall
# before every `pnpm run`/`pnpm exec` just because node_modules was installed on the other side.
verifyDepsBeforeRun: false
